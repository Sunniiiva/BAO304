[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bao304"
version = "0.1.0"
description = "Automated CVE-to-Commit and Patch Analysis Pipeline"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydriller>=2.5",
    "pandas>=2.0",
    "typer>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bao304 = "src.main:app"
